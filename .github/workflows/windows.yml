name: Windows regression test
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build native Windows test harness
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W3 /O2 tests\smoke-test.c /Fe:bin\smoke-test.exe /link /MANIFEST:EMBED user32.lib gdi32.lib comctl32.lib
      - name: Confirm the old DLL fails the regression
        shell: pwsh
        run: |
          Copy-Item bin/smoke-test.exe tests/baseline/smoke-test.exe
          Push-Location tests/baseline
          & ./smoke-test.exe | Tee-Object ../../baseline-results.txt
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 1) { throw "Expected regression assertion failure (1), received $code" }
          exit 0
      - name: Test the shipping DLL on Windows
        shell: pwsh
        run: |
          Push-Location bin
          & ./smoke-test.exe | Tee-Object ../windows-results.txt
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Windows regression failed: $code" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: '*results.txt'
